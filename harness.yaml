project:
  name: p06
  type: workflow-automation
  stack: { backend: none, frontend: react-ts }
  kit_version: 2.1.0
builder: { tools: [codex, claude-code], long_running: true, clean_context_reviewer: false, stop_hook_runs_check: true }
product: { has_agent: false, pattern: workflow, runtime: none, multi_agent: none, rag: false, memory: none, tools_via_mcp: false }
risk: { trifecta: { private_data: true, untrusted_content: true, external_comms: false }, multi_tenant: true, sensitive_data: true, irreversible_actions: [], governance: lite }
budget: { max_turns: 0, max_usd_per_task: 0, tool_timeout_s: 60 }
evals: { capability: true, regression: true, trials: 1, production_sampling: false, judge: code-first }
saas:
  api_contract: { format: openapi, path: contract/p05-openapi.json, client_codegen: openapi-typescript }
  frontend_budget: { max_bundle_kb: 120, a11y_check: true }
  release: { rollback_plan_required: true, observability_min: [structured_logs, metrics, tracing] }
